<svg width="360" height="200" viewBox="0 0 360 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tour-screen" x1="150" y1="30" x2="215" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4EA"/>
      <stop offset="1" stop-color="#FFE3D0"/>
    </linearGradient>
    <linearGradient id="tour-hero" x1="146" y1="58" x2="212" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA468"/>
      <stop offset="1" stop-color="#F26A2E"/>
    </linearGradient>
    <radialGradient id="tour-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 104) scale(118 86)">
      <stop stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tour-phone-shadow" x="100" y="0" width="160" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A4A2B" flood-opacity="0.18"/>
    </filter>
    <filter id="tour-badge-shadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7A4A2B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- soft light behind the phone -->
  <ellipse cx="180" cy="104" rx="118" ry="86" fill="url(#tour-glow)"/>

  <!-- the tour route: a dashed loop through the four stops -->
  <path d="M74 66 C 92 22, 150 14, 180 14 C 214 14, 268 22, 286 66 M286 66 C 312 112, 300 150, 280 156 M80 156 C 58 148, 50 108, 74 66"
        stroke="#FF8A4C" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>

  <!-- ground shadow -->
  <ellipse cx="180" cy="188" rx="58" ry="7" fill="#7A4A2B" opacity="0.10"/>

  <!-- phone with a tiny SpotOn home screen -->
  <g transform="rotate(-6 180 102)" filter="url(#tour-phone-shadow)">
    <rect x="132" y="20" width="96" height="164" rx="22" fill="#FFFFFF"/>
    <rect x="140" y="28" width="80" height="148" rx="16" fill="url(#tour-screen)"/>
    <rect x="168" y="33" width="24" height="5" rx="2.5" fill="#FFFFFF"/>
    <!-- greeting lines -->
    <rect x="148" y="46" width="44" height="5" rx="2.5" fill="#211A15" opacity="0.55"/>
    <rect x="148" y="55" width="28" height="3.5" rx="1.75" fill="#211A15" opacity="0.22"/>
    <!-- hero card -->
    <rect x="148" y="64" width="64" height="38" rx="9" fill="url(#tour-hero)"/>
    <rect x="155" y="72" width="26" height="4" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="155" y="80" width="34" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="155" y="89" width="20" height="7" rx="3.5" fill="#FFFFFF"/>
    <!-- list rows -->
    <rect x="148" y="108" width="64" height="16" rx="6" fill="#FFFFFF"/>
    <circle cx="157" cy="116" r="4" fill="#FFE9DA"/>
    <rect x="165" y="114" width="30" height="4" rx="2" fill="#211A15" opacity="0.18"/>
    <rect x="148" y="128" width="64" height="16" rx="6" fill="#FFFFFF"/>
    <circle cx="157" cy="136" r="4" fill="#FFE9DA"/>
    <rect x="165" y="134" width="22" height="4" rx="2" fill="#211A15" opacity="0.18"/>
    <!-- tab bar with the raised scan button -->
    <rect x="144" y="156" width="72" height="16" rx="8" fill="#FFFFFF"/>
    <circle cx="180" cy="157" r="8" fill="#FFFFFF"/>
    <circle cx="180" cy="157" r="6" fill="#FF8A4C"/>
    <circle cx="156" cy="164" r="2" fill="#FF8A4C"/>
    <circle cx="168" cy="164" r="2" fill="#E8D9CD"/>
    <circle cx="192" cy="164" r="2" fill="#E8D9CD"/>
    <circle cx="204" cy="164" r="2" fill="#E8D9CD"/>
  </g>

  <!-- stop 1: check a spot -->
  <g filter="url(#tour-badge-shadow)">
    <circle cx="74" cy="66" r="24" fill="#FFFFFF"/>
  </g>
  <g stroke="#FF8A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 60 V56 a2 2 0 0 1 2 -2 H69"/>
    <path d="M79 54 H83 a2 2 0 0 1 2 2 V60"/>
    <path d="M85 72 V76 a2 2 0 0 1 -2 2 H79"/>
    <path d="M69 78 H65 a2 2 0 0 1 -2 -2 V72"/>
  </g>
  <circle cx="74" cy="66" r="4.5" fill="#B5643A"/>

  <!-- stop 2: find a dermatologist -->
  <g filter="url(#tour-badge-shadow)">
    <circle cx="286" cy="66" r="24" fill="#FFFFFF"/>
  </g>
  <path d="M286 79 C 286 79, 275 69.5, 275 62 a11 11 0 0 1 22 0 C 297 69.5, 286 79, 286 79 Z" fill="#FF8A4C"/>
  <path d="M286 57.5 V66.5 M281.5 62 H290.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

  <!-- stop 3: learn the signs -->
  <g filter="url(#tour-badge-shadow)">
    <circle cx="80" cy="156" r="20" fill="#FFFFFF"/>
  </g>
  <path d="M70 149 C 74 147, 77 147.5, 80 150 C 83 147.5, 86 147, 90 149 V163 C 86 161, 83 161.5, 80 164 C 77 161.5, 74 161, 70 163 Z"
        fill="#FFE9DA" stroke="#FF8A4C" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M80 150 V164" stroke="#FF8A4C" stroke-width="2.2"/>

  <!-- stop 4: your spots on the body -->
  <g filter="url(#tour-badge-shadow)">
    <circle cx="280" cy="156" r="20" fill="#FFFFFF"/>
  </g>
  <circle cx="280" cy="145.5" r="3.6" fill="#FF8A4C"/>
  <path d="M271 152.5 H289 M280 152.5 V159.5 M280 159.5 L275.5 168 M280 159.5 L284.5 168"
        stroke="#FF8A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="283.5" cy="156" r="1.8" fill="#B5643A"/>

  <!-- sparkles -->
  <g fill="#FF8A4C">
    <path d="M318 30 l3.5 8.5 l8.5 3.5 l-8.5 3.5 l-3.5 8.5 l-3.5 -8.5 l-8.5 -3.5 l8.5 -3.5 z" opacity="0.85"/>
    <path d="M38 108 l2.6 6 l6 2.6 l-6 2.6 l-2.6 6 l-2.6 -6 l-6 -2.6 l6 -2.6 z" opacity="0.6"/>
    <circle cx="234" cy="12" r="3" opacity="0.45"/>
    <circle cx="326" cy="112" r="3.5" opacity="0.4"/>
    <circle cx="118" cy="184" r="3" opacity="0.35"/>
  </g>
</svg>
